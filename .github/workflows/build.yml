name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pynput

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name WideSpace
          --icon icon.ico
          --hidden-import pynput.keyboard._win32
          Main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WideSpace-Windows
          path: dist/WideSpace.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WideSpace.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install pyinstaller pynput python-xlib

      - name: Build binary
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name WideSpace
          --add-data "icon.png:."
          Main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WideSpace-Linux
          path: dist/WideSpace

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WideSpace